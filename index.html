<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="ポーカーのハンド記録とAI分析（MTT/SNG）">
<title>Poker Tracker — ハンド記録 & AI分析</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%233fb950'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>:root{
  --bg:#0d1117; --bg2:#161b22; --bg3:#1e252e; --line:#2b3440;
  --fg:#e6edf3; --fg2:#9aa7b4; --fg3:#6b7785;
  --accent:#3fb950; --accent2:#2ea043;
  --red:#f85149; --blue:#58a6ff; --gold:#d29922; --purple:#a371f7;
  --r:12px; --safe: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.55; overscroll-behavior-y:contain;
}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
a{color:var(--blue)}

/* layout */
#appbar{
  position:sticky;top:0;z-index:50;background:rgba(13,17,23,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 14px;
}
#appbar h1{font-size:17px;margin:0;font-weight:700;flex:1;letter-spacing:.02em}
#appbar .sub{font-size:11px;color:var(--fg3);font-weight:400;display:block;margin-top:1px}
.iconbtn{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:13px;cursor:pointer}
main{padding:14px 14px calc(90px + var(--safe));max-width:760px;margin:0 auto}
.view{display:none}
.view.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

nav#tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;
  background:rgba(22,27,34,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-bottom:var(--safe);
}
nav#tabs button{
  flex:1;background:none;border:0;color:var(--fg3);padding:9px 2px 8px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;
}
nav#tabs button .ic{font-size:19px;line-height:1}
nav#tabs button.on{color:var(--accent)}

/* cards / blocks */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2,.card h3{margin:0 0 10px;font-size:14px;letter-spacing:.03em;color:var(--fg2);font-weight:600}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.muted{color:var(--fg3)}
.small{font-size:12px}
.tiny{font-size:11px}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}

label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:11px;color:var(--fg3);margin-bottom:4px;letter-spacing:.04em}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
  width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:70px;resize:vertical;line-height:1.5}

.btn{background:var(--accent2);border:0;color:#fff;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;font-size:15px}
.btn:active{opacity:.8}
.btn.ghost{background:var(--bg3);border:1px solid var(--line);color:var(--fg);font-weight:600}
.btn.danger{background:transparent;border:1px solid var(--red);color:var(--red);font-weight:600}
.btn.full{width:100%}
.grid2>.btn{font-size:14px;padding:11px 8px;white-space:nowrap}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--bg3);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;user-select:none}
.chip.on{background:var(--accent2);border-color:var(--accent);color:#fff;font-weight:700}
.chip.hero{border-color:var(--gold);color:var(--gold)}

.stat{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stat .v{font-size:19px;font-weight:800;letter-spacing:-.02em}
.stat .k{font-size:10px;color:var(--fg3);margin-top:2px;letter-spacing:.04em}
.pos{color:var(--accent)} .neg{color:var(--red)}

.item{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:9px;cursor:pointer}
.item:active{border-color:var(--accent)}
.badge{display:inline-block;background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:11px;color:var(--fg2)}
.badge.g{border-color:var(--accent);color:var(--accent)}
.badge.r{border-color:var(--red);color:var(--red)}
.badge.b{border-color:var(--blue);color:var(--blue)}
.badge.p{border-color:var(--purple);color:var(--purple)}

/* playing cards */
.pc{
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  width:34px;height:46px;border-radius:6px;background:#fbfbfb;color:#111;font-weight:800;
  font-size:17px;line-height:1;border:1px solid #d0d0d0;box-shadow:0 1px 3px rgba(0,0,0,.4);
}
.pc .s{font-size:13px;margin-top:1px}
.pc.s-h,.pc.s-d{color:#d1242f}
.pc.s-s,.pc.s-c{color:#101418}
.pc.empty{background:transparent;border:1px dashed var(--line);color:var(--fg3);box-shadow:none;font-size:18px;font-weight:400}
.pc.sm2{width:26px;height:35px;font-size:13px}
.pc.sm2 .s{font-size:10px}
.cardrow{display:flex;gap:5px;align-items:center}

/* card picker */
.pickgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.pickgrid .pc{width:100%;height:42px;cursor:pointer}
.pickgrid .pc.used{opacity:.25}
.suittabs{display:flex;gap:6px;margin-bottom:10px}
.suittabs button{flex:1;background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:9px;font-size:19px;cursor:pointer}
.suittabs button.on{border-color:var(--accent);background:#132018}
.suittabs button.rd{color:#f06a70}

/* modal */
#modal{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}
#modal.on{display:flex}
#modal .sheet{
  background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;
  width:100%;max-width:760px;max-height:92vh;overflow:auto;padding:16px 14px calc(20px + var(--safe));
  animation:up .2s ease;
}
@keyframes up{from{transform:translateY(20px);opacity:.5}to{transform:none;opacity:1}}
#modal h3{margin:0 0 12px;font-size:16px}

/* street block */
.street{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--bg3)}
.street>.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.street>.hd b{font-size:12px;letter-spacing:.08em;color:var(--fg2)}
.act{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;margin-bottom:5px;font-size:13px}
.act .who{font-weight:700;min-width:52px}
.act .who.hero{color:var(--gold)}
.act .x{margin-left:auto;color:var(--fg3);cursor:pointer;padding:0 4px;font-size:16px}
.act .amt{color:var(--blue);font-weight:600}

.aibox{background:#10171f;border:1px solid #24313f;border-left:3px solid var(--purple);border-radius:8px;padding:12px;white-space:pre-wrap;font-size:13.5px;line-height:1.7}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty-state{text-align:center;color:var(--fg3);padding:34px 10px;font-size:13px}
.bar{height:7px;background:var(--bg3);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th,table.t td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--fg3);font-weight:600;font-size:11px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:var(--bg3);border:1px solid var(--accent);
  color:var(--fg);padding:10px 18px;border-radius:999px;z-index:300;font-size:13px;animation:fade .2s}

/* 手番パネル */
.turnbox{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:9px}
.turnbox.hero{border-color:var(--gold);background:#231e10}
.turnbox.done{color:var(--fg3);font-size:12.5px;text-align:center;padding:12px}
.turnbox .who2{font-size:20px;font-weight:800;letter-spacing:.02em;margin:1px 0 3px}
.turnbox.hero .who2{color:var(--gold)}
.chips.actbtns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.chip.big{padding:13px 8px;font-size:15px;font-weight:700;text-align:center;border-radius:10px}
details summary::-webkit-details-marker{display:none}
details summary{list-style:none}
details summary:before{content:'▸ ';}
details[open] summary:before{content:'▾ ';}

.mdh{display:block;color:var(--accent);font-weight:800;margin:12px 0 3px;font-size:14px;letter-spacing:.02em}
.aibox .mdh:first-child{margin-top:0}
.aibox b{color:#fff}
.chip.on .muted{color:rgba(255,255,255,.78)}

/* クイック集計 */
.tallygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.tallybtn{position:relative;background:var(--bg3);border:1px solid var(--line);border-radius:12px;
  padding:16px 4px 14px;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--fg);
  display:flex;flex-direction:column;align-items:center;gap:4px}
.tallybtn:active{transform:scale(.96);border-color:var(--accent)}
.tallybtn .tc{font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--fg2)}
.tallybtn.t-fold{opacity:.85}
.tallybtn.t-open,.tallybtn.t-threebet,.tallybtn.t-allin{border-color:#2b4034}
.tallybtn.t-open .tc,.tallybtn.t-threebet .tc,.tallybtn.t-allin .tc{color:var(--accent)}
.tallybtn.t-limp{border-color:#3d3320}
.tallybtn.t-limp .tc{color:var(--gold)}
</style>

<body>
<header id="appbar">
  <span style="font-size:20px">♠</span>
  <h1 id="apptitle">Poker Tracker</h1>
  <button class="iconbtn" data-a="newsession">＋</button>
</header>

<main id="app"></main>

<nav id="tabs">
  <button data-v="dash" class="on"><span class="ic">📊</span>ホーム</button>
  <button data-v="sessions"><span class="ic">🏆</span>大会</button>
  <button data-v="hands"><span class="ic">🃏</span>ハンド</button>
  <button data-v="stats"><span class="ic">🤖</span>分析</button>
  <button data-v="settings"><span class="ic">⚙️</span>設定</button>
</nav>

<div id="modal"><div class="sheet"></div></div>

<script>/* ===========================================================
   Poker Tracker MTT — core (store / utils / cards / positions)
   =========================================================== */
'use strict';

const APP_VERSION = 'v1.9';
const KEY = 'pokerlog_mtt_v1';
const DEFAULTS = {
  v: 1,
  settings: {
    provider: 'anthropic',
    apiKey: '',
    model: 'claude-sonnet-5',
    currency: '円',
    coach: 'balanced',
    usdJpy: 155,
    heroName: ''
  },
  sessions: [],
  hands: []
};

let DB = load();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return structuredClone(DEFAULTS);
    const d = JSON.parse(raw);
    return Object.assign(structuredClone(DEFAULTS), d, {
      settings: Object.assign({}, DEFAULTS.settings, d.settings || {})
    });
  } catch (e) {
    console.warn('load failed', e);
    return structuredClone(DEFAULTS);
  }
}
/** 旧バージョンで保存された古いモデル名を現行IDへ読み替える */
const MODEL_FIX = {
  'claude-sonnet-4-5': 'claude-sonnet-5',
  'claude-opus-4-5': 'claude-opus-5',
  'claude-3-5-sonnet-latest': 'claude-sonnet-5',
  'claude-3-opus-20240229': 'claude-opus-5'
};
if (MODEL_FIX[DB.settings.model]) DB.settings.model = MODEL_FIX[DB.settings.model];

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch (e) { toast('保存に失敗しました（容量超過？）'); }
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* ---------- utils ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (v, d) => { const n = parseFloat(v); return isFinite(n) ? n : (d || 0); };
const r1 = n => Math.round(n * 10) / 10;
const fmtBB = n => (n > 0 ? '+' : '') + r1(n) + 'BB';
const fmtMoney = n => (n > 0 ? '+' : '') + Math.round(n).toLocaleString() + DB.settings.currency;
const sign = n => n > 0 ? 'pos' : (n < 0 ? 'neg' : '');
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

/* ---------- cards ---------- */
const RANKS = ['A', 'K', 'Q', 'J', 'T', '9', '8', '7', '6', '5', '4', '3', '2'];
const SUITS = [
  { k: 's', sym: '♠', name: 'スペード' },
  { k: 'h', sym: '♥', name: 'ハート' },
  { k: 'd', sym: '♦', name: 'ダイヤ' },
  { k: 'c', sym: '♣', name: 'クラブ' }
];
const suitSym = k => (SUITS.find(s => s.k === k) || {}).sym || '';

function cardHTML(c, cls) {
  cls = cls || '';
  if (!c) return `<span class="pc empty ${cls}">+</span>`;
  const r = c[0], s = c[1];
  return `<span class="pc s-${s} ${cls}">${r}<span class="s">${suitSym(s)}</span></span>`;
}
function cardsHTML(arr, n, cls) {
  arr = arr || [];
  let out = '';
  const len = n || arr.length;
  for (let i = 0; i < len; i++) out += cardHTML(arr[i], cls);
  return out;
}
// 'As' -> 'A♠' for prompts
const cardTxt = c => c ? c[0] + suitSym(c[1]) : '?';
const cardsTxt = a => (a || []).filter(Boolean).map(cardTxt).join(' ') || '-';

/* ---------- positions ---------- */
const POS_TABLE = {
  9: ['UTG', 'UTG+1', 'MP', 'MP+1', 'HJ', 'CO', 'BTN', 'SB', 'BB'],
  8: ['UTG', 'UTG+1', 'MP', 'HJ', 'CO', 'BTN', 'SB', 'BB'],
  7: ['UTG', 'MP', 'HJ', 'CO', 'BTN', 'SB', 'BB'],
  6: ['UTG', 'MP', 'CO', 'BTN', 'SB', 'BB'],
  5: ['MP', 'CO', 'BTN', 'SB', 'BB'],
  4: ['CO', 'BTN', 'SB', 'BB'],
  3: ['BTN', 'SB', 'BB'],
  2: ['BTN/SB', 'BB']
};
const positions = n => POS_TABLE[n] || POS_TABLE[9];

const ACTS = [
  { k: 'fold', ja: 'フォールド', en: 'folds', amt: false },
  { k: 'check', ja: 'チェック', en: 'checks', amt: false },
  { k: 'call', ja: 'コール', en: 'calls', amt: true },
  { k: 'bet', ja: 'ベット', en: 'bets', amt: true },
  { k: 'raise', ja: 'レイズ', en: 'raises to', amt: true },
  { k: 'allin', ja: 'オールイン', en: 'all-in', amt: true }
];
const actJa = k => (ACTS.find(a => a.k === k) || {}).ja || k;
const actEn = k => (ACTS.find(a => a.k === k) || {}).en || k;

const STREETS = [
  { k: 'pre', ja: 'プリフロップ', en: 'PREFLOP', cards: 0 },
  { k: 'flop', ja: 'フロップ', en: 'FLOP', cards: 3 },
  { k: 'turn', ja: 'ターン', en: 'TURN', cards: 1 },
  { k: 'river', ja: 'リバー', en: 'RIVER', cards: 1 }
];

/* ---------- hand helpers ---------- */
function newHand(sessionId) {
  const s = DB.sessions.find(x => x.id === sessionId) || {};
  const last = DB.hands.filter(h => h.sessionId === sessionId).sort((a, b) => b.createdAt - a.createdAt)[0];
  return {
    id: uid(),
    sessionId: sessionId,
    createdAt: Date.now(),
    level: last ? Object.assign({}, last.level) : { sb: 100, bb: 200, ante: 200 },
    anteEqBB: last ? last.anteEqBB !== false : true,   // アンティ＝BBが既定
    unit: last ? (last.unit || 'bb') : 'bb',           // スタックの入力単位
    tableSize: last ? last.tableSize : (s.tableSize || 9),
    heroPos: 'BTN',
    heroBB: last ? last.heroBB : 40,
    effBB: last ? last.effBB : 40,
    heroChips: last ? last.heroChips : null,
    effChips: last ? last.effChips : null,
    playersIn: 0,
    cards: { hero: [], flop: [], turn: [], river: [] },
    streets: { pre: [], flop: [], turn: [], river: [] },
    result: 0,
    showdown: false,
    villains: [],
    tags: [],
    memo: '',
    ai: null
  };
}

/** ハンド中のヒーローの全アクション */
function heroActs(h, st) {
  return (h.streets[st] || []).filter(a => a.hero);
}
function sawStreet(h, st) {
  return (h.streets[st] || []).length > 0 || (st === 'flop' && h.cards.flop.filter(Boolean).length === 3);
}
/** 自発的にチップを入れたか（VPIP） */
function isVPIP(h) {
  return heroActs(h, 'pre').some(a => ['call', 'bet', 'raise', 'allin'].includes(a.act));
}
function isPFR(h) {
  return heroActs(h, 'pre').some(a => ['raise', 'allin'].includes(a.act) || (a.act === 'bet'));
}
/** プリフロップでヒーローが3bet以上を打ったか */
function is3BetPlus(h) {
  const pre = h.streets.pre || [];
  let aggr = 0;
  for (const a of pre) {
    if (['raise', 'bet', 'allin'].includes(a.act)) {
      aggr++;
      if (a.hero && aggr >= 2) return true;  // BBのポストを除き、2回目以降の攻撃＝3bet相当
    }
  }
  return false;
}
function heroAllin(h) {
  return Object.keys(h.streets).some(k => heroActs(h, k).some(a => a.act === 'allin'));
}

/** アンティ合計（BB単位） */
function anteBB(h) {
  const bbU = h.level.bb || 1;
  if (!h.level.ante) return 0;
  const a = h.level.ante / bbU;
  const players = h.playersIn || h.tableSize || 9;
  return h.anteType === 'each' ? r1(a * players) : r1(a);
}

/**
 * ポットサイズ（BB単位）。金額は各ストリートの「合計投入額(to)」で入力される前提。
 * upto を渡すとそのストリート終了時点まで。
 */
function potBB(h, upto) {
  const order = ['pre', 'flop', 'turn', 'river'];
  const stop = upto ? order.indexOf(upto) : 3;
  let pot = anteBB(h);
  for (let i = 0; i <= stop && i >= 0; i++) {
    const st = order[i];
    const contrib = {};
    if (st === 'pre') {
      const ps = positions(h.tableSize);
      if (ps.includes('SB')) contrib['SB'] = 0.5;
      if (ps.includes('BTN/SB')) contrib['BTN/SB'] = 0.5;
      contrib['BB'] = 1;
    }
    for (const a of (h.streets[st] || [])) {
      if (a.act === 'fold' || a.act === 'check') continue;
      const v = num(a.amt);
      contrib[a.pos] = Math.max(contrib[a.pos] || 0, v);
    }
    pot += Object.values(contrib).reduce((x, y) => x + y, 0);
  }
  return r1(pot);
}

/** そのストリート開始時点のポット（ベットサイズ提案用） */
const potBefore = (h, st) => {
  const order = ['pre', 'flop', 'turn', 'river'];
  const i = order.indexOf(st);
  return i <= 0 ? anteBB(h) + 1.5 : potBB(h, order[i - 1]);
};


/* ===========================================================
   統計計算
   =========================================================== */

function sessionCost(s) {
  return num(s.buyin) + num(s.fee) + num(s.rebuyCost) + num(s.addonCost);
}
function sessionProfit(s) {
  return num(s.prize) - sessionCost(s);
}
function sessionStats(list) {
  list = list || DB.sessions;
  const n = list.length;
  const cost = list.reduce((a, s) => a + sessionCost(s), 0);
  const prize = list.reduce((a, s) => a + num(s.prize), 0);
  const profit = prize - cost;
  const itm = list.filter(s => num(s.prize) > 0).length;
  const fin = list.filter(s => num(s.finish) > 0 && num(s.entrants) > 0);
  const avgPct = fin.length ? fin.reduce((a, s) => a + num(s.finish) / num(s.entrants), 0) / fin.length : 0;
  const cashes = list.filter(s => num(s.prize) > 0);
  const best = list.reduce((a, s) => Math.max(a, sessionProfit(s)), -Infinity);
  const worst = list.reduce((a, s) => Math.min(a, sessionProfit(s)), Infinity);
  return {
    n, cost, prize, profit,
    roi: cost ? profit / cost : 0,
    itmRate: n ? itm / n : 0,
    itm,
    avgFinishPct: avgPct,
    avgCash: cashes.length ? prize / cashes.length : 0,
    best: isFinite(best) ? best : 0,
    worst: isFinite(worst) ? worst : 0,
    avgBuyin: n ? cost / n : 0
  };
}

/* ---------- クイック集計（全ハンドのワンタップ記録） ---------- */
const TALLY_KEYS = [
  { k: 'fold', ja: 'フォールド', vpip: false, pfr: false },
  { k: 'limp', ja: 'リンプ', vpip: true, pfr: false },
  { k: 'call', ja: 'コール参加', vpip: true, pfr: false },
  { k: 'open', ja: 'レイズ', vpip: true, pfr: true },
  { k: 'threebet', ja: '3ベット+', vpip: true, pfr: true },
  { k: 'allin', ja: 'オールイン', vpip: true, pfr: true }
];
function emptyTally() { const t = { n: 0 }; TALLY_KEYS.forEach(x => t[x.k] = 0); return t; }
function tallyStats(list) {
  list = list || DB.sessions;
  const t = emptyTally();
  for (const s of list) {
    if (!s.tally) continue;
    t.n += num(s.tally.n);
    TALLY_KEYS.forEach(x => t[x.k] += num(s.tally[x.k]));
  }
  if (!t.n) return { n: 0 };
  const vpipN = TALLY_KEYS.filter(x => x.vpip).reduce((a, x) => a + t[x.k], 0);
  const pfrN = TALLY_KEYS.filter(x => x.pfr).reduce((a, x) => a + t[x.k], 0);
  return {
    n: t.n, counts: t,
    vpip: vpipN / t.n,
    pfr: pfrN / t.n,
    threeBet: (t.threebet + t.allin) / t.n,
    limpRate: t.limp / t.n
  };
}

function handStats(list) {
  list = list || DB.hands;
  const n = list.length;
  if (!n) return { n: 0 };
  const vpip = list.filter(isVPIP).length;
  const pfr = list.filter(isPFR).length;
  const tb = list.filter(is3BetPlus).length;
  const flopSeen = list.filter(h => h.cards.flop.filter(Boolean).length === 3);
  const sd = list.filter(h => h.showdown);
  const won = list.filter(h => num(h.result) > 0).length;
  const net = list.reduce((a, h) => a + num(h.result), 0);
  const ai = list.filter(heroAllin);
  const byPos = {};
  for (const h of list) {
    const p = h.heroPos || '?';
    byPos[p] = byPos[p] || { n: 0, net: 0, vpip: 0, win: 0 };
    byPos[p].n++;
    byPos[p].net += num(h.result);
    if (isVPIP(h)) byPos[p].vpip++;
    if (num(h.result) > 0) byPos[p].win++;
  }
  return {
    n, net,
    vpip: vpip / n, pfr: pfr / n, threeBet: tb / n,
    flopRate: flopSeen.length / n,
    wtsd: flopSeen.length ? sd.length / flopSeen.length : 0,
    winRate: won / n,
    allinRate: ai.length / n,
    allinNet: ai.reduce((a, h) => a + num(h.result), 0),
    byPos
  };
}

/** 累積損益グラフ用SVG */
function lineChart(values, w, h) {
  w = w || 320; h = h || 110;
  if (!values.length) return '<div class="empty-state">データなし</div>';
  const cum = []; let s = 0;
  for (const v of values) { s += v; cum.push(s); }
  const min = Math.min(0, ...cum), max = Math.max(0, ...cum);
  const span = (max - min) || 1;
  const px = i => values.length === 1 ? w / 2 : (i / (values.length - 1)) * (w - 8) + 4;
  const py = v => h - 6 - ((v - min) / span) * (h - 14);
  const pts = cum.map((v, i) => px(i) + ',' + py(v)).join(' ');
  const zero = py(0);
  const last = cum[cum.length - 1];
  const col = last >= 0 ? 'var(--accent)' : 'var(--red)';
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block">
    <line x1="0" y1="${zero}" x2="${w}" y2="${zero}" stroke="#2b3440" stroke-width="1" stroke-dasharray="3 3"/>
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${px(cum.length - 1)}" cy="${py(last)}" r="3.5" fill="${col}"/>
  </svg>`;
}

function barChart(rows, fmt) {
  if (!rows.length) return '<div class="empty-state">データなし</div>';
  const max = Math.max(...rows.map(r => Math.abs(r.v)), 1);
  return rows.map(r => {
    const pct = Math.abs(r.v) / max * 100;
    const col = r.v >= 0 ? 'var(--accent)' : 'var(--red)';
    return `<div style="margin-bottom:7px">
      <div class="spread tiny"><span>${esc(r.k)}<span class="muted"> ${r.sub || ''}</span></span>
        <span class="${sign(r.v)}">${fmt ? fmt(r.v) : r1(r.v)}</span></div>
      <div class="bar"><i style="width:${pct}%;background:${col}"></i></div>
    </div>`;
  }).join('');
}

/* ===========================================================
   ハンド記録エディタ
   =========================================================== */
const DRAFT = {};   // street -> {pos, act, amt, open}

/** そのストリートで各ポジションが今いくら出しているか */
function committedMap(h, st) {
  const m = {};
  if (st === 'pre') {
    const ps = positions(h.tableSize);
    if (ps.includes('SB')) m['SB'] = 0.5;
    if (ps.includes('BTN/SB')) m['BTN/SB'] = 0.5;
    m['BB'] = 1;
  }
  for (const a of (h.streets[st] || [])) {
    if (a.act === 'fold' || a.act === 'check') continue;
    m[a.pos] = Math.max(m[a.pos] || 0, num(a.amt));
  }
  return m;
}
/** そのストリートで今そろえるべき額（＝一番高いベット） */
function currentBet(h, st) {
  const m = committedMap(h, st);
  return r1(Math.max(0, ...Object.values(m), 0));
}
/** 降りた人 */
function foldedSet(h, uptoSt) {
  const order = ['pre', 'flop', 'turn', 'river'];
  const stop = order.indexOf(uptoSt);
  const s = new Set();
  for (let i = 0; i <= stop; i++)
    for (const a of (h.streets[order[i]] || [])) if (a.act === 'fold') s.add(a.pos);
  return s;
}
/** アクション順（プリはUTG→BB、ポストフロップはSB→BTN） */
function actionOrder(h, st) {
  const ps = positions(h.tableSize);
  if (st === 'pre') return ps.slice();
  const i = ps.findIndex(p => p === 'SB' || p === 'BTN/SB');
  return i < 0 ? ps.slice() : ps.slice(i).concat(ps.slice(0, i));
}
/** 直前に行動した人の次の人（降りた人は飛ばす） */
function nextActor(h, st, lastPos) {
  const ord = actionOrder(h, st);
  const folded = foldedSet(h, st);
  const i = ord.indexOf(lastPos);
  for (let k = 1; k <= ord.length; k++) {
    const p = ord[(i + k) % ord.length];
    if (!folded.has(p)) return p;
  }
  return null;
}

/** そのストリートより前に降りた人 */
function foldedBefore(h, st) {
  const order = ['pre', 'flop', 'turn', 'river'];
  const s = new Set();
  for (let i = 0; i < order.indexOf(st); i++)
    for (const a of (h.streets[order[i]] || [])) if (a.act === 'fold') s.add(a.pos);
  return s;
}

/**
 * ストリートの進行状況を再生して求める。
 * → 誰の手番か / いくらそろえるべきか / まだ残っているのは誰か / ラウンドは終わったか
 */
function streetState(h, st) {
  const ord = actionOrder(h, st);
  const before = foldedBefore(h, st);
  let active = ord.filter(p => !before.has(p));
  const committed = {};
  const allin = new Set();
  let acted = new Set();
  let currentBet = 0;

  if (st === 'pre') {
    const ps = positions(h.tableSize);
    if (ps.includes('SB')) committed['SB'] = 0.5;
    if (ps.includes('BTN/SB')) committed['BTN/SB'] = 0.5;
    if (ps.includes('BB')) committed['BB'] = 1;
    currentBet = 1;
  }

  const acts = h.streets[st] || [];
  for (const a of acts) {
    if (a.act === 'fold') { active = active.filter(p => p !== a.pos); acted.add(a.pos); continue; }
    acted.add(a.pos);
    if (a.act === 'check') continue;
    const v = num(a.amt);
    committed[a.pos] = Math.max(committed[a.pos] || 0, v);
    if (a.act === 'allin') allin.add(a.pos);
    if (committed[a.pos] > currentBet) {       // 新しいアグレッション → 他の人は再度アクションが必要
      currentBet = committed[a.pos];
      acted = new Set([a.pos]);
    }
  }

  // 次に行動する人
  let toAct = null;
  if (active.length > 1) {
    const last = acts.length ? acts[acts.length - 1].pos : null;
    const start = last ? ord.indexOf(last) + 1 : 0;
    for (let k = 0; k < ord.length; k++) {
      const p = ord[(start + k) % ord.length];
      if (!active.includes(p) || allin.has(p)) continue;
      if (!acted.has(p) || (committed[p] || 0) < currentBet) { toAct = p; break; }
    }
  }

  return {
    ord, active, committed, allin, currentBet: r1(currentBet), toAct,
    complete: !toAct,
    onlyOneLeft: active.length <= 1,
    toCall: (p) => r1(Math.max(0, currentBet - (committed[p] || 0)))
  };
}

/** そのストリートより前に、そのポジションが投入した合計（BB） */
function committedBefore(h, st, pos) {
  const order = ['pre', 'flop', 'turn', 'river'];
  const stop = order.indexOf(st);
  let t = 0;
  for (let i = 0; i < stop; i++) {
    const s2 = order[i];
    let m = 0;
    if (s2 === 'pre') {
      if (pos === 'SB' || pos === 'BTN/SB') m = 0.5;
      if (pos === 'BB') m = 1;
    }
    for (const a of (h.streets[s2] || [])) {
      if (a.pos === pos && a.act !== 'fold' && a.act !== 'check') m = Math.max(m, num(a.amt));
    }
    t += m;
  }
  return r1(t);
}
/** そのストリート開始時点で、その人が「まだ出せる額」＝オールインの上限 */
function remainingStack(h, st, pos) {
  return r1(Math.max(0, num(h.effBB) - committedBefore(h, st, pos)));
}

function heroContrib(h) {
  let t = 0;
  for (const st of ['pre', 'flop', 'turn', 'river']) {
    let m = 0;
    if (st === 'pre') {
      if (h.heroPos === 'SB' || h.heroPos === 'BTN/SB') m = 0.5;
      if (h.heroPos === 'BB') m = 1;
    }
    for (const a of (h.streets[st] || [])) {
      if (a.hero && a.act !== 'fold' && a.act !== 'check') m = Math.max(m, num(a.amt));
    }
    t += m;
  }
  return r1(t);
}

    <button class="btn danger" data-a="delhand" data-id="${h.id}">このハンドを削除</button>
  </div>`;
}

function allUsedCards(h) {
  return [].concat(h.cards.hero, h.cards.flop, h.cards.turn, h.cards.river, h.villains || []).filter(Boolean);
}

/** その場面で選べるアクションだけを出す */
function allowedActs(st, cb) {
  if (st === 'pre') return cb > 1 ? ['fold', 'call', 'raise', 'allin'] : ['fold', 'check', 'call', 'raise', 'allin'];
  return cb > 0 ? ['fold', 'call', 'raise', 'allin'] : ['check', 'bet', 'allin', 'fold'];
}

/** 進行状況に応じて表示するストリートを絞る（画面を短く保つ） */
function visibleStreets(h) {
  const out = [STREETS[0], STREETS[1]];
  const nf = h.cards.flop.filter(Boolean).length;
  const nt = h.cards.turn.filter(Boolean).length;
  if (nf === 3 || (h.streets.flop || []).length) out.push(STREETS[2]);
  if (nt === 1 || (h.streets.turn || []).length) out.push(STREETS[3]);
  return out;
}

/** 連続するフォールドを1行にまとめて表示する */
function actRows(acts) {
  const rows = [];
  let i = 0;
  while (i < acts.length) {
    if (acts[i].act === 'fold' && !acts[i].hero) {
      let j = i;
      while (j + 1 < acts.length && acts[j + 1].act === 'fold' && !acts[j + 1].hero) j++;
      if (j > i) {
        rows.push({ group: true, from: i, to: j, n: j - i + 1, label: acts[i].pos + '〜' + acts[j].pos });
        i = j + 1; continue;
      }
    }
    rows.push({ a: acts[i], i }); i++;
  }
  return rows;
}

function streetBlock(h, st, used) {
  const acts = h.streets[st.k] || [];
  const d = DRAFT[st.k] || {};
  const board = st.k === 'flop' ? h.cards.flop : st.k === 'turn' ? h.cards.turn : st.k === 'river' ? h.cards.river : null;
  const pot = potBB(h, st.k);
  const S = streetState(h, st.k);
  const cb = S.currentBet;

  // 手番（手動で変えていればそちら）
  const actor = d.manual || S.toAct;
  const isHero = actor === h.heroPos;
  const toCall = actor ? S.toCall(actor) : 0;
  const facing = toCall > 0;

  // 金額クイックボタン
  const allinAmt = actor ? remainingStack(h, st.k, actor) : num(h.effBB);
  let quick;
  if (facing) {
    quick = [{ l: '2.5x', v: r1(cb * 2.5) }, { l: '3x', v: r1(cb * 3) },
    { l: 'ポットレイズ', v: r1(pot + cb) }, { l: 'All-in', v: allinAmt }];
  } else if (st.k === 'pre') {
    quick = [{ l: '2.2', v: 2.2 }, { l: '2.5', v: 2.5 }, { l: '3', v: 3 }, { l: 'All-in', v: allinAmt }];
  } else {
    quick = [{ l: '1/3', v: r1(pot / 3) }, { l: '1/2', v: r1(pot / 2) }, { l: '2/3', v: r1(pot * 2 / 3) },
    { l: 'Pot', v: r1(pot) }, { l: 'All-in', v: allinAmt }];
  }

  // 選べるアクション
  const choices = facing ? ['fold', 'call', 'raise', 'allin']
    : (st.k === 'pre' && cb >= 1 && actor === 'BB' ? ['check', 'raise', 'allin']
      : ['check', st.k === 'pre' ? 'raise' : 'bet', 'allin', 'fold']);

  const needAmt = d.act && (ACTS.find(a => a.k === d.act) || {}).amt && d.act !== 'call';

  // ── 手番パネル ──
  const boardReady = !st.cards || (board || []).filter(Boolean).length === st.cards;
  let panel;
  if (!boardReady) {
    panel = `<div class="turnbox done">先に${st.ja}のカードを入力してください。</div>`;
  } else if (S.onlyOneLeft) {
    panel = `<div class="turnbox done">全員が降りました。ハンド終了です。
      <button class="btn sm full" style="margin-top:8px" data-a="claimpot">ポットを獲得（収支に反映）</button></div>`;
  } else if (!actor) {
    panel = `<div class="turnbox done">このストリートのアクションは記録済みです。
      ${st.k === 'river' ? '' : '<br>次のカードを上で入力してください。'}
      <button class="btn ghost sm full" style="margin-top:8px" data-a="manualon" data-st="${st.k}">アクションを追加する</button></div>`;
  } else {
    const skip = (st.k === 'pre' && !acts.length && actor !== h.heroPos && S.ord.indexOf(h.heroPos) > S.ord.indexOf(actor))
      ? `<button class="btn ghost sm full" style="margin-bottom:8px" data-a="foldtohero" data-st="${st.k}">自分（${esc(h.heroPos)}）の番まで全員フォールド</button>` : '';
    panel = `${skip}
    <div class="turnbox ${isHero ? 'hero' : ''}">
      <div class="tiny muted">${isHero ? 'あなたの番' : '相手の番'}</div>
      <div class="who2">${esc(actor)}${isHero ? ' ★あなた' : ''}</div>
      <div class="tiny">${facing ? `コールに <b style="color:var(--blue)">${toCall}BB</b> 必要（相手の額 ${cb}BB）` : 'ベットはまだ出ていません'} ／ ポット ${pot}BB</div>
      <div class="tiny muted">残りスタック ${allinAmt}BB（これがオールインの上限）</div>
    </div>
    <div class="chips actbtns">
      ${choices.map(k => {
        const a = ACTS.find(x => x.k === k);
        return `<span class="chip big ${d.act === k ? 'on' : ''}" data-a="dact" data-st="${st.k}" data-k="${k}">${a.ja}${k === 'call' ? ` ${toCall}` : ''}</span>`;
      }).join('')}
    </div>
    ${needAmt ? `<div style="margin-top:9px">
      <div class="tiny muted" style="margin-bottom:4px">いくらにした？（そのストリートの合計額）</div>
      <div class="chips" style="margin-bottom:6px">${quick.map(q => `<span class="chip tiny" data-a="qamt" data-st="${st.k}" data-v="${q.v}">${q.l}<span class="muted"> ${q.v}</span></span>`).join('')}</div>
      <div class="row">
        <input type="number" step="0.1" inputmode="decimal" id="amt-${st.k}" placeholder="BB" value="${d.amt != null ? d.amt : ''}" style="flex:1">
        <button class="btn sm" data-a="addact" data-st="${st.k}">確定</button>
      </div></div>` : ''}
    ${!isHero && cb > 0 && !S.onlyOneLeft ? `<button class="btn ghost sm full" style="margin-top:8px" data-a="foldrest" data-st="${st.k}">以降は全員フォールド（自分がポット獲得）</button>` : ''}
    <details style="margin-top:8px"><summary class="tiny muted" style="cursor:pointer">手番を手動で変える</summary>
      <div class="chips" style="margin-top:6px">
        ${S.ord.map(p => `<span class="chip tiny ${actor === p ? 'on' : ''}"
          style="${S.active.includes(p) ? '' : 'opacity:.35;text-decoration:line-through'}"
          data-a="setactor" data-st="${st.k}" data-p="${esc(p)}">${esc(p)}${p === h.heroPos ? '★' : ''}</span>`).join('')}
      </div></details>`;
  }

  return `<div class="card">
    <div class="spread" style="margin-bottom:8px">
      <h2 style="margin:0">${st.ja}</h2>
      <span class="tiny muted">ポット ${pot}BB</span>
    </div>
    ${st.cards ? `<div class="cardrow" data-a="pick" data-t="${st.k}" data-n="${st.cards}" style="cursor:pointer;margin-bottom:10px">
        ${cardsHTML(board, st.cards)}<span class="muted tiny" style="margin-left:8px">タップして入力</span></div>` : ''}
    ${actRows(acts).map(r => r.group
      ? `<div class="act" style="opacity:.55">
          <span class="who">${esc(r.label)}</span><span>フォールド</span>
          <span class="tiny muted">${r.n}人</span>
          <span class="x" data-a="delgroup" data-st="${st.k}" data-from="${r.from}" data-to="${r.to}">✕</span>
        </div>`
      : `<div class="act">
          <span class="who ${r.a.hero ? 'hero' : ''}">${esc(r.a.pos)}</span>
          <span>${actJa(r.a.act)}</span>
          ${r.a.amt ? `<span class="amt">${r1(r.a.amt)}BB</span>` : ''}
          <span class="x" data-a="delact" data-st="${st.k}" data-i="${r.i}">✕</span>
        </div>`).join('')}
    <div style="margin-top:${acts.length ? 10 : 2}px">${panel}</div>
  </div>`;
}

/* ---------- ハンドヒストリー文字列 ---------- */
function handHistory(h) {
  const s = DB.sessions.find(x => x.id === h.sessionId) || {};
  const L = [];
  L.push(`【${s.format === 'SNG' ? 'SNG' : 'MTT'}】${s.name || ''} ${s.date || ''}`);
  L.push(`ブラインド: ${h.level.sb}/${h.level.bb}${h.level.ante ? ' ante ' + h.level.ante : ''} / ${h.tableSize}人テーブル`);
  L.push(`自分: ${h.heroPos} スタック ${h.heroBB}BB / 実効 ${h.effBB}BB / ハンド ${cardsTxt(h.cards.hero)}`);
  if (h.remaining) L.push(`大会状況: 残り${h.remaining}人${h.itmLine ? '（入賞ライン ' + h.itmLine + '人）' : ''}`);
  L.push('');
  for (const st of STREETS) {
    const acts = h.streets[st.k] || [];
    let board = '';
    if (st.k === 'flop') board = cardsTxt(h.cards.flop);
    if (st.k === 'turn') board = cardsTxt(h.cards.turn);
    if (st.k === 'river') board = cardsTxt(h.cards.river);
    if (!acts.length && !(board && board !== '-')) continue;
    L.push(`--- ${st.ja}${board && board !== '-' ? ' [' + board + ']' : ''} (ポット ${potBefore(h, st.k)}BB) ---`);
    for (const a of acts) {
      L.push(`${a.pos}${a.hero ? '(自分)' : ''}: ${actJa(a.act)}${a.amt ? ' ' + r1(a.amt) + 'BB' : ''}`);
    }
  }
  L.push('');
  L.push(`結果: ${h.showdown ? 'ショーダウン' : 'ショーダウンなし'} / 収支 ${fmtBB(num(h.result))}`);
  if ((h.villains || []).filter(Boolean).length) L.push(`相手のハンド: ${cardsTxt(h.villains)}`);
  if (h.memo) L.push(`自分のメモ: ${h.memo}`);
  return L.join('\n');
}

/* ===========================================================
   GTO参照データ
   - プリフロップチャート（ソルバー解の一般的な近似）
   - レンジ判定 / 必要勝率 / SPR / モンテカルロ・エクイティ
   すべて端末内で計算し、AIプロンプトに「客観データ」として渡す
   =========================================================== */

const RANK_V = { A: 14, K: 13, Q: 12, J: 11, T: 10, 9: 9, 8: 8, 7: 7, 6: 6, 5: 5, 4: 4, 3: 3, 2: 2 };
const V_RANK = Object.fromEntries(Object.entries(RANK_V).map(([k, v]) => [v, k]));

/** ['Qd','Qc'] -> 'QQ' / ['As','Kh'] -> 'AKo' / ['Kd','Jd'] -> 'KJs' */
function handCat(cards) {
  if (!cards || cards.filter(Boolean).length < 2) return null;
  let [a, b] = cards;
  let r1 = RANK_V[a[0]], r2 = RANK_V[b[0]];
  if (r2 > r1) { [a, b] = [b, a];[r1, r2] = [r2, r1]; }
  if (r1 === r2) return V_RANK[r1] + V_RANK[r2];
  return V_RANK[r1] + V_RANK[r2] + (a[1] === b[1] ? 's' : 'o');
}

/** レンジ文字列（"55+, A9s+, KQo, A5s-A2s" など）にハンドが含まれるか */
function inRange(cat, rangeStr) {
  if (!cat || !rangeStr) return false;
  const pair = cat.length === 2;
  const hi = RANK_V[cat[0]], lo = RANK_V[cat[1]], suf = cat[2] || '';
  for (let tok of rangeStr.split(',').map(t => t.trim()).filter(Boolean)) {
    const plus = tok.endsWith('+');
    if (plus) tok = tok.slice(0, -1);
    if (tok.includes('-')) {                       // 範囲 A5s-A2s / 99-66
      const [t1, t2] = tok.split('-');
      if (t1.length === 2 && pair) {               // ペア範囲
        const a = RANK_V[t1[0]], b = RANK_V[t2[0]];
        if (hi <= Math.max(a, b) && hi >= Math.min(a, b)) return true;
      } else if (t1.length === 3 && !pair && suf === t1[2] && RANK_V[t1[0]] === hi) {
        const a = RANK_V[t1[1]], b = RANK_V[t2[1]];
        if (lo <= Math.max(a, b) && lo >= Math.min(a, b)) return true;
      }
      continue;
    }
    if (tok.length === 2) {                        // ペア
      if (!pair) continue;
      const base = RANK_V[tok[0]];
      if (plus ? hi >= base : hi === base) return true;
      continue;
    }
    if (tok.length === 3) {                        // スーテッド/オフ
      if (pair || suf !== tok[2]) continue;
      if (RANK_V[tok[0]] !== hi) continue;
      const base = RANK_V[tok[1]];
      if (plus ? (lo >= base && lo < hi) : lo === base) return true;
    }
  }
  return false;
}

    'HJ': '44+, A4s+, K9s+, QTs+, JTs, A9o+, KJo+',
    'CO': '33+, A2s+, K8s+, Q9s+, J9s+, T9s, A7o+, KTo+, QJo',
    'BTN': '22+, A2s+, K5s+, Q8s+, J8s+, T8s+, 98s, A2o+, K9o+, QTo+, JTo',
    'SB': '22+, A2s+, K4s+, Q6s+, J7s+, T7s+, 97s+, A2o+, K8o+, Q9o+, JTo',
    'BTN/SB': '22+, A2s+, K5s+, Q8s+, J8s+, T8s+, 98s, A2o+, K9o+, QTo+, JTo'
  }
};
const GTO_NOTE = '※内蔵チャートはGTOソルバー解の一般的な近似（9max・アンティあり）。厳密解ではないが基準として十分。';

/* ---------- 5/7カード評価（エクイティ計算用） ---------- */
function cardNum(c) { return { r: RANK_V[c[0]], s: c[1] }; }

function eval5(cs) {
  const rs = cs.map(c => c.r).sort((a, b) => b - a);
  const suits = {};
  cs.forEach(c => suits[c.s] = (suits[c.s] || 0) + 1);
  const flush = Object.values(suits).some(n => n === 5);
  const cnt = {};
  rs.forEach(r => cnt[r] = (cnt[r] || 0) + 1);
  const groups = Object.entries(cnt).map(([r, n]) => [+r, n])
    .sort((a, b) => b[1] - a[1] || b[0] - a[0]);
  // ストレート（A-5対応）
  const uniq = [...new Set(rs)];
  let straightHi = 0;
  if (uniq.length === 5) {
    if (uniq[0] - uniq[4] === 4) straightHi = uniq[0];
    else if (uniq[0] === 14 && uniq[1] === 5 && uniq[4] === 2) straightHi = 5;
  }
  const kick = groups.flatMap(([r, n]) => Array(n).fill(r));
  const pack = arr => arr.reduce((a, v) => a * 15 + v, 0);
  if (flush && straightHi) return 8e10 + straightHi;
  if (groups[0][1] === 4) return 7e10 + pack([groups[0][0], groups[1][0]]);
  if (groups[0][1] === 3 && groups[1][1] === 2) return 6e10 + pack([groups[0][0], groups[1][0]]);
  if (flush) return 5e10 + pack(rs);
  if (straightHi) return 4e10 + straightHi;
  if (groups[0][1] === 3) return 3e10 + pack(kick);
  if (groups[0][1] === 2 && groups[1][1] === 2) return 2e10 + pack(kick);
  if (groups[0][1] === 2) return 1e10 + pack(kick);
  return pack(rs);
}

function eval7(cs) {
  let best = -1;
  for (let i = 0; i < 6; i++) for (let j = i + 1; j < 7; j++) {
    const five = cs.filter((_, k) => k !== i && k !== j);
    const v = eval5(five);
    if (v > best) best = v;
  }
  return best;
}

const FULL_DECK = (() => {
  const d = [];
  for (const r of Object.keys(RANK_V)) for (const s of ['s', 'h', 'd', 'c']) d.push(r + s);
  return d;
})();

/**
 * モンテカルロ・エクイティ。
 * villain=null なら「ランダムハンド」との勝率。boardは0/3/4/5枚。
 */
function equityMC(hero, villain, board, iters) {
  iters = iters || 1600;
  board = (board || []).filter(Boolean);
  const used = new Set([...hero, ...(villain || []), ...board]);
  const deck = FULL_DECK.filter(c => !used.has(c));
  const hc = hero.map(cardNum);
  let win = 0, tie = 0;
  for (let it = 0; it < iters; it++) {
    // Fisher–Yates 部分シャッフル
    const d = deck.slice();
    const need = (villain ? 0 : 2) + (5 - board.length);
    for (let i = 0; i < need; i++) {
      const j = i + Math.floor(Math.random() * (d.length - i));
      [d[i], d[j]] = [d[j], d[i]];
    }
    let k = 0;
    const vil = villain ? villain.slice() : [d[k++], d[k++]];
    const fullBoard = board.concat(d.slice(k, k + (5 - board.length)));
    const bn = fullBoard.map(cardNum);
    const hv = eval7(hc.concat(bn));
    const vv = eval7(vil.map(cardNum).concat(bn));
    if (hv > vv) win++; else if (hv === vv) tie++;
  }
  return (win + tie / 2) / iters;
}

/* ---------- ハンドの客観データを組み立てる ---------- */
function gtoContext(h) {
  try {
    const L = [];
    const cat = handCat(h.cards.hero);
    const eff = num(h.effBB);
    L.push('【参照データ】アプリが計算した客観値。以下を分析の根拠として必ず引用すること。');

    // --- プリフロップチャート判定 ---
    if (cat) {
      L.push(`■プリフロップ（自分: ${cat} / ${h.heroPos} / 実効${eff}BB）`);
      const openR = GTO_OPEN[h.heroPos];
      if (openR) {
        L.push(`・オープンレンジ判定: ${inRange(cat, openR) ? '含まれる ✓' : '含まれない ✗'}（${h.heroPos}の基準レンジ: ${openR}）`);
      } else if (h.heroPos === 'BB') {
        L.push('・BBはオープンレンジ非該当（ディフェンス/3ベットの判断はエクイティと必要勝率で評価すること）');
      }
      if (eff <= 12) {
        const p = GTO_PUSH[10][h.heroPos];
        if (p) L.push(`・オープンプッシュ判定(≈10BB): ${inRange(cat, p) ? 'プッシュレンジに含まれる ✓' : '含まれない ✗'}`);
      } else if (eff <= 18) {
        const p = GTO_PUSH[15][h.heroPos];
        if (p) L.push(`・オープンプッシュ判定(≈15BB): ${inRange(cat, p) ? 'プッシュレンジに含まれる ✓' : '含まれない ✗'}`);
      }
      L.push(GTO_NOTE);
    }

    // --- SPR ---
    const flopPot = potBB(h, 'pre');
    if ((h.streets.flop || []).length || h.cards.flop.filter(Boolean).length === 3) {
      const behind = Math.max(0, eff - committedBefore(h, 'flop', h.heroPos));
      if (flopPot > 0) L.push(`■フロップSPR: ${r1(behind / flopPot)}（残りスタック${r1(behind)}BB ÷ ポット${flopPot}BB）`);
    }

    // --- 各ストリートの必要勝率 / ベットサイズ ---
    const order = ['pre', 'flop', 'turn', 'river'];
    const oddsLines = [];
    for (const stk of order) {
      const base = stk === 'pre' ? anteBB(h) : potBB(h, order[order.indexOf(stk) - 1]);
      const contrib = {};
      if (stk === 'pre') {
        const ps = positions(h.tableSize);
        if (ps.includes('SB')) contrib['SB'] = 0.5;
        if (ps.includes('BTN/SB')) contrib['BTN/SB'] = 0.5;
        contrib['BB'] = 1;
      }
      const stJa = (STREETS.find(x => x.k === stk) || {}).ja || stk;
      for (const a of (h.streets[stk] || [])) {
        if (a.act === 'fold' || a.act === 'check') continue;
        const before = contrib[a.pos] || 0;
        const added = Math.max(0, num(a.amt) - before);
        const potNow = base + Object.values(contrib).reduce((x, y) => x + y, 0);
        if (a.hero && a.act === 'call' && added > 0) {
          const req = added / (potNow + added);
          oddsLines.push(`・${stJa}: 自分のコール ${r1(added)}BB → 必要勝率 ${(req * 100).toFixed(1)}%（ポット${r1(potNow)}BBに対して）`);
        }
        if (a.hero && (a.act === 'bet' || a.act === 'raise' || a.act === 'allin') && added > 0 && potNow > 0) {
          oddsLines.push(`・${stJa}: 自分の${actJa(a.act)} ${r1(num(a.amt))}BB ＝ ポットの${(added / potNow * 100).toFixed(0)}%（相手の必要勝率 ${(added / (potNow + 2 * added) * 100).toFixed(1)}% / 自分のブラフ成功必要率 ${(added / (potNow + added) * 100).toFixed(1)}%）`);
        }
        contrib[a.pos] = Math.max(before, num(a.amt));
      }
    }
    if (oddsLines.length) { L.push('■ポットオッズ / ベットサイズ'); L.push(...oddsLines); }

    // --- エクイティ ---
    if (h.cards.hero.filter(Boolean).length === 2) {
      const vil = (h.villains || []).filter(Boolean).length === 2 ? h.villains : null;
      const eqLines = [];
      const stages = [
        ['プリフロップ', []],
        ['フロップ', h.cards.flop],
        ['ターン', h.cards.flop.concat(h.cards.turn)],
        ['リバー', h.cards.flop.concat(h.cards.turn, h.cards.river)]
      ];
      let prevLen = -1;
      for (const [name, bd] of stages) {
        const b = (bd || []).filter(Boolean);
        if (name !== 'プリフロップ' && (b.length < 3 || b.length === prevLen)) continue;
        prevLen = b.length;
        const vsRnd = equityMC(h.cards.hero, null, b);
        let line = `・${name}: 対ランダムハンド ${(vsRnd * 100).toFixed(0)}%`;
        if (vil) line += ` ／ 対相手実ハンド(${cardsTxt(vil)}) ${(equityMC(h.cards.hero, vil, b) * 100).toFixed(0)}%`;
        eqLines.push(line);
      }
      if (eqLines.length) {
        L.push('■エクイティ（モンテカルロ1600回・誤差±2%程度）');
        L.push(...eqLines);
        if (vil) L.push('※「対相手実ハンド」は結果論の後知恵。判断の評価には各時点の情報だけを使うこと。');
      }
    }
    return L.join('\n');
  } catch (e) {
    console.warn('gtoContext failed', e);
    return '';
  }
}

/* ---------- 料金と使用量 ---------- */
// USD / 100万トークン  [入力, 出力]
const PRICES = {
  'claude-opus-5': [5, 25],
  'claude-sonnet-5': [2, 10],
  'claude-haiku-4-5': [1, 5],
  'claude-fable-5': [10, 50]
};
function priceOf(model) {
  if (!model) return null;
  if (PRICES[model]) return PRICES[model];
  const k = Object.keys(PRICES).find(x => model.indexOf(x) === 0);
  return k ? PRICES[k] : null;
}
/** 料金（USD）。料金表に無いモデルは null */
function costUSD(model, inTok, outTok) {
  const p = priceOf(model);
  if (!p) return null;
  return inTok / 1e6 * p[0] + outTok / 1e6 * p[1];
}
const usdToJpy = usd => usd == null ? null : usd * (num(DB.settings.usdJpy) || 155);
const fmtYen = usd => {
  const y = usdToJpy(usd);
  if (y == null) return '料金表に無いモデル';
  return y < 1 ? '約' + y.toFixed(2) + '円' : '約' + y.toFixed(1) + '円';
};

function monthKey() { return today().slice(0, 7); }

/** 1回の呼び出しを使用量に加算し、その明細を返す */
function recordUsage(model, inTok, outTok) {
  const usd = costUSD(model, inTok, outTok);
  DB.usage = DB.usage || { n: 0, in: 0, out: 0, usd: 0, months: {} };
  const u = DB.usage;
  u.n++; u.in += inTok; u.out += outTok; u.usd += (usd || 0);
  const mk = monthKey();
  u.months[mk] = u.months[mk] || { n: 0, in: 0, out: 0, usd: 0 };
  const m = u.months[mk];
  m.n++; m.in += inTok; m.out += outTok; m.usd += (usd || 0);
  save();
  return { model, in: inTok, out: outTok, usd };
}
const usageLine = (u) => !u ? '' :
  `入力 ${(u.in || 0).toLocaleString()} / 出力 ${(u.out || 0).toLocaleString()} トークン ・ ${fmtYen(u.usd)}`;

/* ---------- Markdown簡易描画（見出しと太字だけ） ---------- */
function mdLite(t) {
  let s = esc(String(t || ''));
  s = s.replace(/^\s*#{1,6}\s*(.+)$/gm, '<span class="mdh">$1</span>');
  s = s.replace(/^\s*(【.+?】.*)$/gm, '<span class="mdh">$1</span>');
  s = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  s = s.replace(/^\s*[-*]\s+/gm, '・');
  // 見出しは display:block なので、前後の余分な改行を詰める
  s = s.replace(/(<span class="mdh">[\s\S]*?<\/span>)\n+/g, '$1');
  s = s.replace(/\n{2,}(<span class="mdh">)/g, '\n$1');
  return s.trim();
}

/** エラーを日本語の原因つきに変換 */
function apiError(status, msg) {
  const m = String(msg || '');
  if (status === 401 || /authentication|invalid x-api-key|Incorrect API key/i.test(m))
    return 'APIキーが正しくありません。設定画面でキーを貼り直してください（先頭の sk- から末尾まで、余分な空白なしで）。';
  if (status === 404 || /model/i.test(m) && /not.*(found|exist)/i.test(m))
    return 'モデル名が見つかりません。設定画面のモデル名を、候補チップから選び直してください。\n（詳細: ' + m + '）';
  if (status === 400 && /credit balance|quota|billing/i.test(m))
    return 'APIの残高が不足しています。コンソールの Billing でクレジットを購入してください。';
  if (status === 429)
    return '短時間に送りすぎです（レート制限）。1分ほど待ってからもう一度お試しください。';
  if (status === 529 || status === 503)
    return 'AI側が混み合っています。少し待ってから再実行してください。';
  return 'APIエラー' + (status ? ' (' + status + ')' : '') + '：' + m;
}

async function callAPI(user, maxTokens) {
  const st = DB.settings;
  if (st.provider === 'none' || !st.apiKey) {
    throw new Error('APIキーが未設定です。設定画面でキーを入力するか、「プロンプトをコピー」でClaudeアプリに貼り付けてください。');
  }
  const sys = systemPrompt();
  const isAnthropic = st.provider === 'anthropic';
  const url = isAnthropic ? 'https://api.anthropic.com/v1/messages' : 'https://api.openai.com/v1/chat/completions';
  const headers = isAnthropic
    ? {
      'content-type': 'application/json',
      'x-api-key': st.apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    }
    : { 'content-type': 'application/json', 'authorization': 'Bearer ' + st.apiKey };
  const body = isAnthropic
    ? { model: st.model, max_tokens: maxTokens || 2000, system: sys, messages: [{ role: 'user', content: user }] }
    : { model: st.model, messages: [{ role: 'system', content: sys }, { role: 'user', content: user }] };

  let res;
  try {
    res = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) });
  } catch (e) {
    throw new Error('AIサーバーに接続できませんでした。\n・ファイルを直接開いている場合はブラウザの制限で通信できません → https で公開したURLから開いてください\n・オフラインでないかも確認してください');
  }
  let j = {};
  try { j = await res.json(); } catch (e) { }
  if (!res.ok) throw new Error(apiError(res.status, (j.error && (j.error.message || j.error.type)) || res.statusText));

  let text, inTok, outTok, cut;
  if (isAnthropic) {
    text = (j.content || []).map(c => c.text || '').join('');
    inTok = ((j.usage || {}).input_tokens) || 0;
    outTok = ((j.usage || {}).output_tokens) || 0;
    cut = j.stop_reason === 'max_tokens';
  } else {
    const ch = (j.choices || [])[0] || {};
    text = (ch.message || {}).content || '';
    inTok = ((j.usage || {}).prompt_tokens) || 0;
    outTok = ((j.usage || {}).completion_tokens) || 0;
    cut = ch.finish_reason === 'length';
  }
  if (!text.trim()) throw new Error('AIから空の回答が返りました。もう一度お試しください。');
  const usage = recordUsage(st.model, inTok, outTok);
  if (cut) text += '\n\n（※ 出力の上限に達したため、ここで途切れています。もう一度実行するか、モデルを変更してみてください）';
  return { text: text.trim(), usage, truncated: !!cut };
}

const callAI = (user, maxTokens) => callAPI(user, maxTokens || 4000);

/** 接続テスト */
async function testAPI() {
  const out = $('#api-test');
  if (out) out.innerHTML = '<div class="aibox"><span class="spin"></span> 接続を確認しています…</div>';
  try {
    const r = await callAPI('これは接続テストです。「接続できました」とだけ返してください。', 64);
    if (out) out.innerHTML = `<div class="aibox" style="border-left-color:var(--accent)">✅ 接続成功
プロバイダ: ${esc(DB.settings.provider)}
モデル: ${esc(DB.settings.model)}
AIの返答: ${esc(r.text)}
${esc(usageLine(r.usage))}</div>`;
    render();
  } catch (e) {
    if (out) out.innerHTML = `<div class="aibox" style="border-left-color:var(--red)">❌ 接続できませんでした

${esc(String(e.message || e))}</div>`;
  }
}

async function runAI(promptText, onDone, outSel, maxTokens) {
  const out = $(outSel || '#ai-out');
  if (out) out.innerHTML = '<div class="aibox"><span class="spin"></span> AIが分析しています…（20〜40秒ほど）</div>';
  try {
    const r = await callAI(promptText, maxTokens);
    onDone(r.text, r.usage);
    toast('分析が完了しました ' + fmtYen(r.usage.usd));
  } catch (e) {
    const msg = String(e.message || e);
    if (out) out.innerHTML = `<div class="aibox" style="border-left-color:var(--red)">分析に失敗しました。\n${esc(msg)}\n\nヒント: ローカルファイルから直接開いている場合、ブラウザの制限でAPIを呼べません。GitHub Pagesなどhttpsで公開したページから使うか、「プロンプトをコピー」してClaudeアプリに貼り付けてください。</div>`;
    else toast('分析に失敗: ' + msg);
  }
}

async function copyText(t) {
  try {
    await navigator.clipboard.writeText(t);
    toast('コピーしました');
  } catch (e) {
    showModal(`<h3>プロンプト（長押しでコピー）</h3>
      <textarea style="min-height:300px;font-size:12px">${esc(t)}</textarea>
      <button class="btn full" data-a="closemodal" style="margin-top:10px">閉じる</button>`);
  }
}


/* ===========================================================
   イベント / 起動
   =========================================================== */
function setPath(obj, path, val) {
  const ks = path.split('.');
  let o = obj;
  for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]] = o[ks[i]] || {};
  o[ks[ks.length - 1]] = val;
}

function currentHand() { return DB.hands.find(x => x.id === STATE.handId); }

/** チップ数 → BB数 */
function chipsToBB(h, chips) {
  const bb = num(h.level.bb) || 1;
  return r1(num(chips) / bb);
}
/** ブラインドが変わったとき、チップ数を基準にBB数を計算し直す */
function syncChips(h) {
  if (h.unit !== 'chips') return;
  if (h.heroChips != null) h.heroBB = chipsToBB(h, h.heroChips);
  if (h.effChips != null) h.effBB = chipsToBB(h, h.effChips);
}

function bindView() {
  // フィールド変更
  $$('#app [data-k]').forEach(el => {
    el.addEventListener('change', () => {
      const h = currentHand();
      if (!h) return;
      const k = el.dataset.k;
      let v;
      if (el.type === 'checkbox') v = el.checked;
      else if (el.type === 'number') v = num(el.value);
      else v = el.value;
      setPath(h, k, v);
      if (k === 'tableSize' && !positions(v).includes(h.heroPos)) h.heroPos = positions(v)[positions(v).length - 1];

      // BBを変えたら：アンティ連動 ＋ チップ入力ならBB数を再計算
      if (k === 'level.bb') {
        if (h.anteEqBB) h.level.ante = num(v);
        syncChips(h);
      }
      // アンティを手で変えたら連動を解除
      if (k === 'level.ante' && num(v) !== num(h.level.bb)) h.anteEqBB = false;
      // チップ数入力 → BB数へ換算
      if (k === 'heroChips') h.heroBB = chipsToBB(h, v);
      if (k === 'effChips') h.effBB = chipsToBB(h, v);
      // BB数を直接いじったらチップ側も合わせる
      if (k === 'heroBB') h.heroChips = Math.round(num(v) * (h.level.bb || 1));
      if (k === 'effBB') h.effChips = Math.round(num(v) * (h.level.bb || 1));

      save();
      if (['level.sb', 'level.bb', 'level.ante', 'tableSize', 'effBB', 'heroBB', 'heroChips', 'effChips'].includes(k)) render();
    });
  });
  const imp = $('#importfile');
  if (imp) imp.addEventListener('change', importJSON);
  const pv = $('#st-provider');
  if (pv) pv.addEventListener('change', () => {
    snapSettings();
    if (DB.settings.provider === 'openai' && DB.settings.model.startsWith('claude')) DB.settings.model = 'gpt-5.1';
    if (DB.settings.provider === 'anthropic' && DB.settings.model.startsWith('gpt')) DB.settings.model = 'claude-sonnet-5';
    save(); render();
  });
}

const ACTIONS = {
  newsession: () => sessionForm(null),
  editsession: (d) => sessionForm(DB.sessions.find(x => x.id === d.id)),
  savesession: (d) => saveSessionFromForm(d.new === '1'),
  closemodal: () => closeModal(),
  'open-session': (d) => go('session', { sessionId: d.id }),
  'back-session': (d) => go('session', { sessionId: d.id }),
  'open-hand': (d) => go('hand', { handId: d.id }),

  delsession: (d) => {
    if (!confirm('このセッションと、含まれる全ハンドを削除します。よろしいですか？')) return;
    DB.sessions = DB.sessions.filter(x => x.id !== d.id);
    DB.hands = DB.hands.filter(x => x.sessionId !== d.id);
    save(); go('sessions');
  },
  newhand: (d) => {
    const h = newHand(d.id);
    DB.hands.push(h); save();
    go('hand', { handId: h.id });
  },
  delhand: (d) => {
    if (!confirm('このハンドを削除しますか？')) return;
    const h = DB.hands.find(x => x.id === d.id);
    const sid = h && h.sessionId;
    DB.hands = DB.hands.filter(x => x.id !== d.id);
    save(); go('session', { sessionId: sid });
  },

  heropos: (d) => { const h = currentHand(); if (h) { h.heroPos = d.p; save(); render(); } },

  // ── クイック集計（1ハンド1タップ）──
  tally: (d) => {
    const s = DB.sessions.find(x => x.id === d.id); if (!s) return;
    s.tally = s.tally || emptyTally();
    s.tallyLog = s.tallyLog || [];
    s.tally.n++; s.tally[d.k] = num(s.tally[d.k]) + 1;
    s.tallyLog.push(d.k);
    if (s.tallyLog.length > 2000) s.tallyLog.shift();
    if (navigator.vibrate) navigator.vibrate(12);
    save(); render();
  },
  tallyundo: (d) => {
    const s = DB.sessions.find(x => x.id === d.id); if (!s || !(s.tallyLog || []).length) return;
    const k = s.tallyLog.pop();
    s.tally.n = Math.max(0, s.tally.n - 1);
    s.tally[k] = Math.max(0, num(s.tally[k]) - 1);
    save(); render(); toast('取り消しました');
  },
  tallytoggle: () => { STATE.tallyOpen = STATE.tallyOpen === false ? true : false; render(); },

  // アンティ＝BB の連動トグル
  toggleante: (d, el) => {
    const h = currentHand(); if (!h) return;
    h.anteEqBB = !h.anteEqBB;
    if (h.anteEqBB) h.level.ante = num(h.level.bb);
    save(); render();
  },
  // スタックの入力単位（BB数 ⇄ チップ数）
  unit: (d) => {
    const h = currentHand(); if (!h) return;
    h.unit = d.u;
    if (d.u === 'chips') {                       // BB数からチップ数を埋めておく
      const bb = h.level.bb || 1;
      if (h.heroChips == null) h.heroChips = Math.round(num(h.heroBB) * bb);
      if (h.effChips == null) h.effChips = Math.round(num(h.effBB) * bb);
    }
    save(); render();
  },

  // カード
  pick: (d) => { const h = currentHand(); if (h) openPicker(d.t, +d.n, h); },
  suit: (d) => { PICK.suit = d.s; renderPicker(); },
  pickcard: (d) => {
    const c = d.c;
    const i = PICK.sel.indexOf(c);
    if (i >= 0) PICK.sel.splice(i, 1);
    else {
      if (allUsedCards(PICK.hand).includes(c) && !PICK.sel.includes(c)) { toast('このカードは既に使用されています'); return; }
      if (PICK.sel.length >= PICK.n) PICK.sel.shift();
      PICK.sel.push(c);
    }
    if (PICK.sel.length === PICK.n) { applyPick(); return; }
    renderPicker();
  },
  pickclear: () => { PICK.sel = []; renderPicker(); },
  pickdone: () => applyPick(),

  // ── アクション入力（手番が自動で進む）──
  setactor: (d) => { DRAFT[d.st] = Object.assign({}, DRAFT[d.st], { manual: d.p, act: null, amt: null }); render(); },
  manualon: (d) => {
    const h = currentHand(); if (!h) return;
    const S = streetState(h, d.st);
    DRAFT[d.st] = { manual: S.active[0] || S.ord[0], act: null, amt: null };
    render();
  },
  dact: (d) => {
    const h = currentHand(); if (!h) return;
    const S = streetState(h, d.st);
    const actor = (DRAFT[d.st] || {}).manual || S.toAct;
    if (!actor) { toast('このストリートは終了しています'); return; }
    DRAFT[d.st] = Object.assign({}, DRAFT[d.st], { act: d.k });
    // 金額のいらないアクションは即登録（コール額は自動計算）
    if (d.k === 'fold' || d.k === 'check') { addAction(d.st, 0); return; }
    if (d.k === 'call') { addAction(d.st, S.currentBet); return; }
    if (d.k === 'allin') DRAFT[d.st].amt = remainingStack(h, d.st, actor);
    render();
    const el = $('#amt-' + d.st); if (el) el.focus();
  },
  qamt: (d) => {
    const el = $('#amt-' + d.st);
    if (el) el.value = d.v;
    DRAFT[d.st] = Object.assign({}, DRAFT[d.st], { amt: +d.v });
    if ((DRAFT[d.st] || {}).act) addAction(d.st, +d.v);
  },
  addact: (d) => addAction(d.st),
  delgroup: (d) => {
    const h = currentHand(); if (!h) return;
    h.streets[d.st].splice(+d.from, (+d.to) - (+d.from) + 1);
    DRAFT[d.st] = {};
    save(); render();
  },
  delact: (d) => {
    const h = currentHand(); if (!h) return;
    h.streets[d.st].splice(+d.i, 1);
    DRAFT[d.st] = {};
    save(); render();
  },
  // 自分の番まで一気にフォールド
  foldtohero: (d) => {
    const h = currentHand(); if (!h) return;
    for (let i = 0; i < 12; i++) {
      const S = streetState(h, d.st);
      if (!S.toAct || S.toAct === h.heroPos) break;
      h.streets[d.st].push({ pos: S.toAct, act: 'fold', amt: 0, hero: false });
    }
    DRAFT[d.st] = {};
    save(); render();
  },
  // 自分以外を全員フォールドさせてハンド終了
  foldrest: (d) => {
    const h = currentHand(); if (!h) return;
    for (let i = 0; i < 12; i++) {
      const S = streetState(h, d.st);
      if (S.onlyOneLeft || !S.toAct) break;
      if (S.toAct === h.heroPos) break;
      h.streets[d.st].push({ pos: S.toAct, act: 'fold', amt: 0, hero: false });
    }
    h.result = r1(potBB(h) - heroContrib(h));
    DRAFT[d.st] = {};
    save(); render(); toast('ポット獲得として記録しました');
  },
  claimpot: () => {
    const h = currentHand(); if (!h) return;
    h.result = r1(potBB(h) - heroContrib(h));
    save(); render(); toast('ポット獲得として記録しました');
  },

  gtoshow: (d) => {
    const h = DB.hands.find(x => x.id === d.id); if (!h) return;
    const out = $('#gto-out');
    if (out) out.innerHTML = '<div class="aibox"><span class="spin"></span> 計算中…</div>';
    setTimeout(() => {
      const t = gtoContext(h);
      if (out) out.innerHTML = t
        ? `<div class="aibox" style="border-left-color:var(--blue)">${mdLite(t)}</div>`
        : '<div class="empty-state">ホールカードを入力すると計算できます</div>';
    }, 30);
  },

  // 結果クイック
  'res-win': () => { const h = currentHand(); h.result = r1(potBB(h) - heroContrib(h)); save(); render(); },
  'res-lose': () => { const h = currentHand(); h.result = -heroContrib(h); save(); render(); },
  'res-zero': () => { const h = currentHand(); h.result = 0; save(); render(); },

  // AI
  'ai-hand': (d) => {
    const h = DB.hands.find(x => x.id === d.id);
    runAI(handPrompt(h), (text, usage) => {
      h.ai = { text, at: new Date().toLocaleString('ja-JP'), model: DB.settings.model, usage };
      save(); render();
    }, '#ai-out', 4000);
  },
  'ai-session': (d) => {
    const s = DB.sessions.find(x => x.id === d.id);
    runAI(sessionPrompt(s), (text, usage) => {
      s.ai = { text, at: new Date().toLocaleString('ja-JP'), model: DB.settings.model, usage };
      save(); render();
    }, '#app', 6000);
  },
  'ai-leak': () => {
    runAI(leakPrompt(), (text, usage) => {
      DB.leakAI = { text, at: new Date().toLocaleString('ja-JP'), model: DB.settings.model, usage };
      save(); render();
    }, '#app', 6000);
  },
  resetusage: () => {
    if (!confirm('AI利用状況の記録をリセットします。よろしいですか？')) return;
    DB.usage = { n: 0, in: 0, out: 0, usd: 0, months: {} };
    save(); render(); toast('リセットしました');
  },
  copyprompt: (d) => {
    const h = DB.hands.find(x => x.id === d.id);
    copyText(systemPrompt() + '\n\n---\n\n' + handPrompt(h));
  },

  // フィルタ
  filter: (d) => {
    const f = d.f || '';
    if (!f) STATE.filter = {};
    else if (f.startsWith('pos:')) STATE.filter = { pos: f.slice(4) };
    else STATE.filter = { [f]: true };
    render();
  },

  // 設定
  setmodel: (d) => {
    snapSettings();                 // 入力中のAPIキーなどを失わないよう先に保存
    DB.settings.model = d.m;
    save(); render();
  },
  savesettings: () => {
    DB.settings.provider = $('#st-provider').value;
    DB.settings.apiKey = $('#st-key').value.trim();
    DB.settings.model = $('#st-model').value.trim();
    DB.settings.coach = $('#st-coach').value;
    DB.settings.currency = $('#st-cur').value || '円';
    if ($('#st-rate')) DB.settings.usdJpy = num($('#st-rate').value, 155);
    save(); toast('設定を保存しました'); render();
  },
  testapi: () => { snapSettings(); testAPI(); },
  forceupdate: async () => {
    try {
      if ('serviceWorker' in navigator) {
        const rs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(rs.map(r => r.unregister()));
      }
      if (window.caches) {
        const ks = await caches.keys();
        await Promise.all(ks.map(k => caches.delete(k)));
      }
    } catch (e) { }
    toast('最新版を読み込みます…');
    setTimeout(() => location.replace(location.pathname + '?u=' + Date.now()), 600);
  },
  export: () => {
    const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
    dl(blob, 'pokerlog-' + today() + '.json');
  },
  exportcsv: () => {
    const rows = [['date', 'session', 'pos', 'hole', 'effBB', 'flop', 'turn', 'river', 'resultBB', 'showdown', 'memo']];
    for (const h of DB.hands) {
      const s = DB.sessions.find(x => x.id === h.sessionId) || {};
      rows.push([s.date || '', s.name || '', h.heroPos, cardsTxt(h.cards.hero), h.effBB,
      cardsTxt(h.cards.flop), cardsTxt(h.cards.turn), cardsTxt(h.cards.river),
      num(h.result), h.showdown ? 'Y' : 'N', (h.memo || '').replace(/\n/g, ' ')]);
    }
    const csv = '﻿' + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
    dl(new Blob([csv], { type: 'text/csv' }), 'pokerlog-hands-' + today() + '.csv');
  },
  wipe: () => {
    if (!confirm('全てのデータを削除します。元に戻せません。よろしいですか？')) return;
    DB = structuredClone(DEFAULTS); save(); go('dash'); toast('削除しました');
  }
};

/** 設定画面の入力中の値をDBへ写す */
function snapSettings() {
  if (!$('#st-provider')) return;
  DB.settings.provider = $('#st-provider').value;
  DB.settings.apiKey = $('#st-key').value.trim();
  DB.settings.model = $('#st-model').value.trim();
  DB.settings.coach = $('#st-coach').value;
  if ($('#st-cur')) DB.settings.currency = $('#st-cur').value || '円';
  if ($('#st-rate')) DB.settings.usdJpy = num($('#st-rate').value, 155);
  save();
}

function addAction(st, forcedAmt) {
  const h = currentHand(); if (!h) return;
  const d = DRAFT[st] || {};
  const S = streetState(h, st);
  const pos = d.manual || S.toAct;
  if (!pos) { toast('このストリートは終了しています'); return; }
  if (!d.act) { toast('アクションを選んでください'); return; }
  const el = $('#amt-' + st);
  const amt = forcedAmt != null ? forcedAmt : (el ? num(el.value) : num(d.amt));
  const needsAmt = (ACTS.find(a => a.k === d.act) || {}).amt;
  if (needsAmt && !amt) { toast('金額(BB)を入力してください'); return; }
  h.streets[st].push({ pos, act: d.act, amt: needsAmt ? amt : 0, hero: pos === h.heroPos });
  DRAFT[st] = {};   // 手番は自動で次の人へ
  save(); render();
}

function dl(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function importJSON(e) {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!d.sessions || !d.hands) throw new Error('形式が違います');
      if (!confirm(`セッション${d.sessions.length}件 / ハンド${d.hands.length}件 を読み込み、現在のデータを置き換えます。`)) return;
      DB = Object.assign(structuredClone(DEFAULTS), d);
      DB.settings = Object.assign({}, DEFAULTS.settings, d.settings || {});
      save(); go('dash'); toast('読み込みました');
    } catch (err) { alert('読み込みに失敗しました: ' + err.message); }
  };
  rd.readAsText(f);
}

/* ---------- 起動 ---------- */
function boot() {
  document.addEventListener('click', ev => {
    const t = ev.target.closest('[data-a]');
    if (t) {
      const fn = ACTIONS[t.dataset.a];
      if (fn) { ev.preventDefault(); fn(t.dataset, t); }
      return;
    }
    if (ev.target.id === 'modal') closeModal();
  });
  $$('#tabs button').forEach(b => b.addEventListener('click', () => go(b.dataset.v)));
  render();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloaded) return; reloaded = true; location.reload();   // 新バージョンを自動反映
    });
    navigator.serviceWorker.register('./sw.js').then(reg => {
      reg.update();
      setInterval(() => reg.update(), 30 * 60 * 1000);
    }).catch(() => { });
  }
}
document.addEventListener('DOMContentLoaded', boot);
